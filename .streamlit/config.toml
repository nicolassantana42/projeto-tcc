[theme]
base = "dark"
primaryColor = "#34d399"
backgroundColor = "#08111d"
secondaryBackgroundColor = "#101d2d"
textColor = "#e7edf4"
font = "sans serif"

[server]
maxUploadSize = 200

[runner]
# Evita uma coleta completa forçada após cada frame/fragmento.
# O coletor automático do Python continua ativo; não usamos gc.disable().
postScriptGC = false

[browser]
gatherUsageStats = false
