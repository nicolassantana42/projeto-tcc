[theme]
# Light "clean academic" palette; full tokens live in src/epi_monitor/ui/theme.py.
base = "light"
primaryColor = "#0F766E"
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#111827"
font = "sans serif"

[server]
maxUploadSize = 200

[runner]
# Evita uma coleta completa forçada após cada frame/fragmento.
# O coletor automático do Python continua ativo; não usamos gc.disable().
postScriptGC = false

[browser]
gatherUsageStats = false
