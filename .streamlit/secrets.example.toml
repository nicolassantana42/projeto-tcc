# Copie para .streamlit/secrets.toml e preencha somente o arquivo local.
# Credenciais aqui não ativam canais: habilite-os na interface.
# Nunca comite secrets.toml nem o inclua na imagem Docker.

[telegram]
token = ""
chat_id = "" # Preserve o sinal negativo de IDs de grupos.

[email]
host = "smtp-mail.outlook.com"
port = 587
username = ""
sender = ""
recipient = ""
security = "starttls" # starttls ou ssl, conforme o provedor.
auth_mode = "oauth2" # oauth2 para Microsoft; password para SMTP que o aceite.
access_token = "" # Token OAuth2 válido para SMTP; não um token Microsoft Graph.
password = "" # Somente se auth_mode = "password" e o provedor permitir.
